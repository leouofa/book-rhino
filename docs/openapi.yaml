openapi: 3.1.0
info:
  title: Book Rhino Platform REST API
  version: 1.0.0
  description: >
    Production-grade REST API for Book Rhino. Built to integrate with
    external TypeScript applications and Model Context Protocol (MCP) servers.
servers:
  - url: /api/v1
    description: Current Environment API v1

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /openapi.json:
    get:
      summary: OpenAPI specification
      security: []
      responses:
        '200':
          description: Live OpenAPI specification in JSON format

  /me:
    get:
      summary: Current authenticated user details
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api_tokens:
    get:
      summary: List user API tokens
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated API tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenListResponse'
    post:
      summary: Generate a new API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                expires_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Token created (includes raw plaintext token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenResponse'

  /api_tokens/{id}:
    delete:
      summary: Revoke an API token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenResponse'

  /operations:
    get:
      summary: List tracked asynchronous AI operations
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed]
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: integer
        - name: operation_type
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationListResponse'

  /operations/{id}:
    get:
      summary: Get operation status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'

  /books:
    get:
      summary: List books
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: writing_style_id
          in: query
          schema:
            type: integer
        - name: perspective_id
          in: query
          schema:
            type: integer
        - name: narrative_structure_id
          in: query
          schema:
            type: integer
        - name: pending
          in: query
          schema:
            type: boolean
        - name: rendering
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
    post:
      summary: Create book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'

  /books/{id}:
    get:
      summary: Get book details with associations and chapters
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
    patch:
      summary: Update book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
    delete:
      summary: Delete book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

  /books/{id}/manuscript:
    get:
      summary: Export full manuscript with chapters, scenes, and compiled markdown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManuscriptResponse'

  /books/{id}/generate_prompt:
    post:
      summary: Trigger AI plot and chapter outlines generation (GenerateBookPlotJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /books/{id}/iterate:
    post:
      summary: Refine book plot with feedback instruction (IterateOnBookPlotJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /books/{id}/render_book:
    post:
      summary: Render entire book content across all chapters (RenderBookJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /books/{id}/versions:
    get:
      summary: List PaperTrail versions of book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionListResponse'

  /books/{id}/versions/{version_id}/revert:
    post:
      summary: Revert book to a previous version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'

  /books/{id}/versions/{version_id}/merge:
    post:
      summary: Merge changes from a previous version using AI (MergeBookPlotsJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /books/{book_id}/chapters:
    get:
      summary: List chapters for a book
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterListResponse'
    post:
      summary: Create chapter for a book
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'

  /chapters:
    get:
      summary: List all chapters across books
      parameters:
        - name: book_id
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterListResponse'
    post:
      summary: Create chapter with book_id in body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'

  /chapters/{id}:
    get:
      summary: Get chapter details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'
    patch:
      summary: Update chapter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'
    delete:
      summary: Delete chapter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

  /chapters/{id}/render_chapter:
    post:
      summary: Render chapter text content (RenderChapterJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /chapters/{id}/generate_scenes:
    post:
      summary: Deconstruct chapter into visual scenes (WriteScenesJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /chapters/{chapter_id}/scenes:
    get:
      summary: List scenes in chapter
      parameters:
        - name: chapter_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneListResponse'
    post:
      summary: Create scene in chapter
      parameters:
        - name: chapter_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneResponse'

  /scenes:
    get:
      summary: List all scenes across chapters
      parameters:
        - name: chapter_id
          in: query
          schema:
            type: integer
        - name: book_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneListResponse'
    post:
      summary: Create scene with chapter_id in body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneResponse'

  /scenes/{id}:
    get:
      summary: Get scene details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneResponse'
    patch:
      summary: Update scene
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneResponse'
    delete:
      summary: Delete scene
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

  /scenes/{id}/render_scene:
    post:
      summary: Generate AI video prompt and description for scene (RenderSceneJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shot_type:
                  type: string
                style:
                  type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /characters:
    get:
      summary: List characters
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: book_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterListResponse'
    post:
      summary: Create character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetailResponse'

  /characters/{id}:
    get:
      summary: Get character details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetailResponse'
    patch:
      summary: Update character
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetailResponse'
    delete:
      summary: Delete character
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

  /characters/{id}/generate_prompt:
    post:
      summary: Generate character prompt (GenerateCharacterPromptJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /characters/{id}/iterate:
    post:
      summary: Iterate on character prompt (IterateOnCharacterPromptJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /characters/{id}/versions:
    get:
      summary: Character version history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionListResponse'

  /characters/{id}/versions/{version_id}/revert:
    post:
      summary: Revert character version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDetailResponse'

  /characters/{id}/versions/{version_id}/merge:
    post:
      summary: Merge character version (MergeCharacterPromptsJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /characters/{character_id}/images:
    get:
      summary: List character images
      parameters:
        - name: character_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
    post:
      summary: Upload character image (file, base64, or image_url)
      parameters:
        - name: character_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                image:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                image_url:
                  type: string
                  format: uri
                image_base64:
                  type: string
                filename:
                  type: string
                content_type:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'

  /character_images/{id}:
    get:
      summary: Get character image details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
    patch:
      summary: Update character image title
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
    delete:
      summary: Delete character image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

  /locations:
    get:
      summary: List locations
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: region_id
          in: query
          schema:
            type: integer
        - name: book_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
    post:
      summary: Create location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationDetailResponse'

  /locations/{id}:
    get:
      summary: Get location details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationDetailResponse'
    patch:
      summary: Update location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationDetailResponse'
    delete:
      summary: Delete location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'

  /locations/{id}/generate_prompt:
    post:
      summary: Generate location prompt (GenerateLocationPromptJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /locations/{id}/iterate:
    post:
      summary: Iterate on location prompt (IterateOnLocationPromptJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /locations/{id}/versions:
    get:
      summary: Location version history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionListResponse'

  /locations/{id}/versions/{version_id}/revert:
    post:
      summary: Revert location version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationDetailResponse'

  /locations/{id}/versions/{version_id}/merge:
    post:
      summary: Merge location version (MergeLocationPromptsJob)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: version_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncAcceptedResponse'

  /locations/{location_id}/images:
    get:
      summary: List location images
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
    post:
      summary: Upload location image
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                image:
                  type: string
                  format: binary
          application/json:
            schema:
