components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: br_live_*
      description: API token prefixed with br_live_

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 25

  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked API token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: User lacks access permission or admin role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MetaPagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total_pages: { type: integer }
        total_count: { type: integer }

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }

    DeleteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: integer }
            deleted: { type: boolean }

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string }
            app: { type: string }
            version: { type: string }
            time: { type: string }

    UserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: integer }
