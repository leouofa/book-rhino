poetic_forms:
  - name: "Epic Poem"
    description: "A lengthy, grand narrative poem recounting the heroic deeds, historic events, and profound trials of extraordinary figures, often involving gods, myths, or fate."
    meter: "Dactylic hexameter or stately heroic verse / unrhymed blank verse"
    rhyme_scheme: "Unrhymed or irregular heroic rhyme"
    guidelines: "Write in elevated, majestic language with formal stanzas or verse paragraphs. Employ classic epic conventions: invocation of the muse, heroic epithets, dramatic speeches, expansive epic similes, catalogues of heroes or arms, and themes of honor, destiny, and cosmic struggle."
    example: "Sing in me, Muse, and through me tell the story / of that man skilled in all ways of contending, / the wanderer, harried for years on end, / after he plundered the stronghold on the proud height of Troy."

  - name: "Ballad"
    description: "A rhythmic narrative poem traditionally meant to be sung or recited, recounting dramatic, romantic, or tragic tales with lively refrains and memorable cadences."
    meter: "Ballad meter (alternating iambic tetrameter and iambic trimeter)"
    rhyme_scheme: "ABCB or ABAB"
    guidelines: "Structure into four-line stanzas (quatrains). Focus on a direct, emotional narrative arc with dramatic action, simple direct dialogue, incremental repetition, and folklore or heroic themes."
    example: "The king sits in Dunfermline town, / Drinking the blude-red wine; / 'O whare will I get a skeely skipper, / To sail this new ship o' mine?'"

  - name: "Heroic Couplets"
    description: "Paired rhyming lines of iambic pentameter that convey narrative pace, wit, rhetorical polish, and balance."
    meter: "Iambic pentameter"
    rhyme_scheme: "AABBCC..."
    guidelines: "Compose in rhymed couplets of ten syllables each with an iambic beat. Strive for balanced syntax, clear parallelisms, antithesis, and memorable closing rhymes that propel the heroic or satirical story forward."
    example: "Know then thyself, presume not God to scan; / The proper study of mankind is man. / Placed on this isthmus of a middle state, / A being darkly wise, and rudely great."

  - name: "Blank Verse"
    description: "Unrhymed verse in regular iambic pentameter, offering rhythmic solemnity, natural speech cadences, and dramatic grandeur."
    meter: "Iambic pentameter"
    rhyme_scheme: "Unrhymed"
    guidelines: "Maintain an unrhymed iambic pentameter rhythm (five stresses per line). Use varied enjambment and caesuras to emulate expressive, dignified speech suitable for grand tragedy, philosophical soliloquies, and cinematic drama."
    example: "Of Man's first disobedience, and the fruit / Of that forbidden tree whose mortal taste / Brought death into the World, and all our woe, / With loss of Eden, till one greater Man / Restore us, and regain the blissful seat."

  - name: "Sonnet Sequence"
    description: "A connected cycle of fourteen-line poems that together unfold an overarching emotional, philosophical, or heroic narrative."
    meter: "Iambic pentameter"
    rhyme_scheme: "ABAB CDCD EFEF GG (Shakespearean) or ABBA ABBA CDECDE (Petrarchan)"
    guidelines: "Divide each section into fourteen-line stanzas with an established volta (turn of thought) in line 9 or line 13. Maintain rich lyrical imagery and meditative depth while advancing the episodic storyline."
    example: "Shall I compare thee to a summer's day? / Thou art more lovely and more temperate: / Rough winds do shake the darling buds of May, / And summer's lease hath all too short a date."
